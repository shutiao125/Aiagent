<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 答疑</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css?v=20261010b">
</head>
<body>
<div id="chat-page">
  <header class="chat-header">
    <span>💬</span>
    <span class="title" id="chat-title">AI 答疑助教</span>
    <span class="mode-tag" id="mode-tag">MOCK</span>
  </header>

  <main class="message-stream" id="message-stream"></main>

  <footer class="composer" id="composer">
    <div class="composer-inner">
      <textarea id="chat-input" rows="1"
        placeholder="输入学习问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="btn-stop" id="btn-stop" title="停止生成">■</button>
      <button class="btn-send" id="btn-send" title="发送">➤</button>
    </div>
    <div class="composer-toolbar">
      <button type="button" id="btn-deep-thinking" class="think-toggle"
        title="开启后模型先进行深度推理再回答，耗时更长、逻辑性更强；关闭则直接回答">
        <span class="think-toggle-icon"></span>深度思考
      </button>
      <span class="composer-foot">AI 答疑内容仅供参考，请注意甄别</span>
    </div>
  </footer>
</div>

<script src="/lib/axios.min.js"></script>
<script src="/lib/marked.min.js"></script>
<script src="/lib/purify.min.js"></script>
<script src="/js/api.js?v=20261010"></script>
<script src="/js/chat.js?v=20261010"></script>
</body>
</html>
